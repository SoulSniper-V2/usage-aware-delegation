name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run contract checks
        run: python tests/test_skill_contract.py
